# Server plugins loaded by FHIRViewer.
#
# Plugins listed in META-INF/services/com.example.fhirviewer.server.FhirServerPlugin
# are discovered automatically and do not need to be repeated here. Use this file
# for plugins you load purely from configuration.
#
# To turn a plugin off without changing the class path, add its class name to
# fhirviewer.plugins.disabled.
#
# Point at a different file with -Dfhirviewer.plugins.config=/path/to/file.properties
# or by placing fhirviewer-plugins.properties in the working directory.

fhirviewer.plugins.enabled=com.example.fhirviewer.server.FirelyPlugin
